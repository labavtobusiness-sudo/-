<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RozmytnyAvto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1c; --blue: #34a8eb; --text: #ffffff; --input: #2c2c2e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { background: var(--card); border-radius: 24px; max-width: 450px; margin: auto; padding: 20px; border: 1px solid #2c2c2e; }
        .title { color: var(--blue); text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; background: var(--input); border: 1px solid #3a3a3c; border-radius: 12px; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        .calc-box { background: #252527; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; border: 1px solid #34a8eb44; }
        .total { font-size: 22px; font-weight: 900; color: var(--blue); }
        .btn-main { width: 100%; padding: 16px; background: var(--blue); border: none; border-radius: 14px; color: white; font-weight: bold; cursor: pointer; }
        .ai-box { margin-top: 20px; background: #151517; padding: 10px; border-radius: 15px; border: 1px solid #34a8eb33; }
        #ai-response { font-size: 13px; margin-top: 10px; color: #ccc; }
        .socials { display: flex; justify-content: space-around; margin-top: 20px; }
        .social-btn { text-decoration: none; color: #9ea0a3; font-size: 12px; background: #252527; padding: 8px 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RozmytnyAvto</div>
        <select id="market" onchange="calc()"><option value="EU">Європа (€)</option><option value="USA">США ($)</option></select>
        <input type="number" id="price" value="5000" oninput="calc()" placeholder="Ціна">
        <select id="year" onchange="calc()"></select>
        <div style="margin:10px 0;"><input type="checkbox" id="mil" onchange="calc()"> Пільга ЗСУ</div>
        <div class="calc-box"><div class="total" id="res">РАЗОМ: 0</div></div>
        <button class="btn-main" onclick="tgOpen('https://t.me/byklya_top')">ЗАМОВИТИ ПІДБІР</button>

        <div class="ai-box">
            <div style="color:var(--blue); font-weight:bold; font-size:14px;">✨ AI Менеджер</div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <input type="text" id="ai-in" placeholder="Запитайте щось..." style="margin:0;">
                <button onclick="ask()" style="background:var(--blue); border:none; border-radius:10px; color:white; padding:0 15px;">></button>
            </div>
            <div id="ai-response"></div>
        </div>

        <div class="socials">
            <a class="social-btn" onclick="tgOpen('https://www.instagram.com/rozmytny.avto')">Instagram</a>
            <a class="social-btn" onclick="tgOpen('https://www.tiktok.com/@rozmytnyavto')">TikTok</a>
            <a class="social-btn" onclick="tgOpen('https://t.me/RozmytnyAvto')">Channel</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const ys = document.getElementById('year');
        for(let y=2025; y>=2000; y--) ys.innerHTML += `<option value="${y}">${y}</option>`;

        function calc() {
            const p = parseFloat(document.getElementById('price').value) || 0;
            const m = document.getElementById('market').value;
            const mil = document.getElementById('mil').checked;
            let tax = mil ? 0 : p * 0.35;
            let fee = mil ? 1500 : (m === 'USA' ? 2800 : 3200);
            document.getElementById('res').innerText = `РАЗОМ: ${Math.round(p+tax+fee)} ${m==='USA'?'$':'€'}`;
        }

        async function ask() {
            const inp = document.getElementById('ai-in').value;
            const box = document.getElementById('ai-response');
            if(!inp) return; box.innerText = "⏳ Думаю...";
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBUovI-9K9bcXPRtY7vSGTwv6o7fOq5P8c`, {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({contents:[{parts:[{text:"Ти менеджер RozmytnyAvto. Коротко: "+inp}]}]})
                });
                const d = await r.json();
                box.innerText = d.candidates[0].content.parts[0].text;
            } catch(e) { box.innerText = "⚠️ Помилка ШІ."; }
        }
        function tgOpen(u) { tg.openTelegramLink(u); }
        calc();
    </script>
</body>
</html>
