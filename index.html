<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RozmytnyAvto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1c; --blue: #34a8eb; --text: #ffffff; --sec: #9ea0a3; --input-bg: #2c2c2e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { background: var(--card); border-radius: 28px; border: 1px solid #2c2c2e; max-width: 400px; margin: auto; padding: 20px; }
        .title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--blue); }
        input, select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid #3a3a3c; border-radius: 12px; color: #fff; margin-bottom: 15px; appearance: auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .calc-box { background: rgba(52, 168, 235, 0.05); padding: 15px; border-radius: 20px; border: 1px solid #34a8eb33; margin: 15px 0; }
        .total { font-size: 20px; font-weight: 900; color: var(--blue); text-align: center; }
        .btn-main { width: 100%; padding: 16px; background: var(--blue); border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; }
        .socials { display: flex; justify-content: space-between; margin-top: 15px; gap: 5px; }
        .social-btn { flex: 1; padding: 10px; background: #252527; border-radius: 10px; text-align: center; font-size: 12px; cursor: pointer; color: white; text-decoration: none; }
        .ai-box { background: #151517; border: 1px solid #34a8eb50; border-radius: 15px; padding: 10px; margin-top: 20px; }
        #ai-response { font-size: 13px; color: var(--sec); margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RozmytnyAvto</div>
        <select id="market" onchange="run()"><option value="EU">ЄС (€)</option><option value="USA">США ($)</option></select>
        <div class="grid">
            <input type="number" id="price" placeholder="Ціна" value="5000" oninput="run()">
            <select id="year" onchange="run()"></select>
        </div>
        <div class="grid">
            <select id="fuel" onchange="run()"><option value="petrol">Бензин</option><option value="diesel">Дизель</option><option value="electric">Електро</option></select>
            <input type="number" id="engine" value="2.0" step="0.1" oninput="run()">
        </div>
        <div style="font-size:14px; margin-bottom:10px;">
            <input type="checkbox" id="isMil" onchange="run()"> Пільга ЗСУ
        </div>
        <div class="calc-box"><div class="total" id="res-total">РАЗОМ: 0</div></div>
        <button class="btn-main" onclick="tgOpen('https://t.me/byklya_top')">ЗАМОВИТИ ПІДБІР</button>
        
        <div class="ai-box">
            <div style="color:var(--blue); font-weight:bold; font-size:14px;">✨ AI Менеджер</div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <input type="text" id="ai-input" placeholder="Питання..." style="margin-bottom:0;">
                <button onclick="askGemini()" style="background:var(--blue); border:none; border-radius:10px; color:white; padding:0 10px;">></button>
            </div>
            <div id="ai-response"></div>
        </div>

        <div class="socials">
            <a class="social-btn" onclick="tgOpen('https://www.instagram.com/rozmytny.avto')">Insta</a>
            <a class="social-btn" onclick="tgOpen('https://www.tiktok.com/@rozmytnyavto')">TikTok</a>
            <a class="social-btn" onclick="tgOpen('https://t.me/RozmytnyAvto')">Channel</a>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        const yearS = document.getElementById('year');
        for(let y=2025; y>=2000; y--) yearS.innerHTML += `<option value="${y}">${y}</option>`;

        function run() {
            const m = document.getElementById('market').value;
            const p = parseFloat(document.getElementById('price').value) || 0;
            const y = parseInt(document.getElementById('year').value);
            const e = parseFloat(document.getElementById('engine').value) || 0;
            const mil = document.getElementById('isMil').checked;
            let tax = mil ? 0 : (p * 0.35); // Спрощена логіка
            let fee = mil ? 1500 : (m === 'USA' ? 2800 : 3200);
            document.getElementById('res-total').innerText = `ПІД КЛЮЧ: ${Math.round(p + tax + fee)} ${m === 'USA' ? '$' : '€'}`;
        }

        async function askGemini() {
            const inp = document.getElementById('ai-input').value;
            const box = document.getElementById('ai-response');
            if(!inp) return; box.innerText = "⏳ Думаю...";
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyCDtj14zSTuypunvIEQcoUf9-Q7ieU2rQg`, {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({contents: [{parts: [{text: "Ти менеджер RozmytnyAvto. Коротко: " + inp}]}]})
                });
                const d = await r.json();
                box.innerText = d.candidates[0].content.parts[0].text;
            } catch(e) { box.innerText = "⚠️ Помилка ключа або мережі."; }
        }
        function tgOpen(url) { tg.openTelegramLink(url); }
        run();
    </script>
</body>
</html>
