<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор @RozmytnyAvto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #34a8eb;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header img {
            width: 120px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-blue);
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-sizing: border-box;
        }

        /* Сітка марок авто */
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-item {
            background: #2c2c2e;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .brand-item.active {
            border-color: var(--accent-blue);
            background: #3a3a3c;
        }

        .brand-item span {
            display: block;
            font-size: 11px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Поля вводу */
        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            margin-left: 5px;
        }

        select, input {
            width: 100%;
            padding: 14px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            appearance: none;
            box-sizing: border-box;
        }

        .calc-btn {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(52, 168, 235, 0.3);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(52, 168, 235, 0.1);
            border-radius: 16px;
            display: none;
            text-align: center;
            border: 1px dashed var(--accent-blue);
        }

        .result-val {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 40px; color: var(--accent-blue); margin-bottom: 5px;">🔵</div>
        <h1>Калькулятор<br>@RozmytnyAvto</h1>
    </div>

    <div class="container">
        <label>Оберіть марку:</label>
        <div class="brand-grid" id="brandGrid">
            <div class="brand-item" onclick="selectBrand(this, 'Audi')"><span>Audi</span></div>
            <div class="brand-item" onclick="selectBrand(this, 'BMW')"><span>BMW</span></div>
            <div class="brand-item" onclick="selectBrand(this, 'Mercedes')"><span>Mercedes</span></div>
            <div class="brand-item" onclick="selectBrand(this, 'VW')"><span>VW</span></div>
            <div class="brand-item" onclick="selectBrand(this, 'Toyota')"><span>Toyota</span></div>
            <div class="brand-item" onclick="selectBrand(this, 'Skoda')"><span>Skoda</span></div>
        </div>

        <div class="input-group">
            <label>Рік випуску</label>
            <select id="year"></select>
        </div>

        <div class="input-group">
            <label>Об'єм двигуна (літри)</label>
            <select id="engine">
                <option value="1.0">1.0 л</option>
                <option value="1.5">1.5 л</option>
                <option value="2.0" selected>2.0 л</option>
                <option value="2.5">2.5 л</option>
                <option value="3.0">3.0 л</option>
                <option value="4.0">4.0 л</option>
            </select>
        </div>

        <div class="input-group">
            <label>Ціна в ЄС (€)</label>
            <input type="number" id="price" placeholder="Наприклад: 12000">
        </div>

        <button class="calc-btn" onclick="calculate()">Розрахувати</button>

        <div id="result" class="result">
            <div style="font-size: 14px; margin-bottom: 5px;">Орієнтовна вартість "під ключ":</div>
            <div class="result-val" id="finalSum">0 €</div>
        </div>
    </div>

    <div class="footer">
        Telegram Mini App v2.0 | @RozmytnyAvto
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let selectedBrand = "";

        // Генерація років від 2000 до 2026
        const yearSelect = document.getElementById('year');
        for (let y = 2026; y >= 2000; y--) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.innerHTML = y;
            yearSelect.appendChild(opt);
        }

        function selectBrand(el, brand) {
            document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            selectedBrand = brand;
        }

        function calculate() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const year = parseInt(document.getElementById('year').value);
            const engine = parseFloat(document.getElementById('engine').value);

            if (price === 0) {
                tg.showAlert("Будь ласка, введіть ціну авто!");
                return;
            }

            // Логіка розрахунку (спрощена)
            let age = 2026 - year;
            if (age < 1) age = 1;
            
            let duty = price * 0.10; // Мито 10%
            let excise = 50 * engine * age; // Акциз (базова ставка * об'єм * роки)
            let vat = (price + duty + excise) * 0.20; // ПДВ 20%
            let services = 2800; // Послуги (доставка, брокер, сертифікація тощо)

            let total = price + duty + excise + vat + services;

            document.getElementById('result').style.display = 'block';
            document.getElementById('finalSum').innerText = Math.round(total).toLocaleString() + ' €';
            
            tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
