<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabAvto Business 2026</title>
    <style>
        body { font-family: sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* СТИЛІ КАЛЬКУЛЯТОРА */
        .calc-container { width: 100%; max-width: 400px; background: #1a1a1a; padding: 20px; border-radius: 20px; border: 1px solid #333; margin-top: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .calc-btn { width: 100%; padding: 15px; background: #ffd700; color: black; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* СТИЛІ ПРЕМІУМ КАРТКИ */
        #premium-card { display: none; width: 100%; max-width: 400px; background: linear-gradient(145deg, #1a1a1a, #222); border-radius: 24px; padding: 25px; border: 1px solid #ffd700; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        .price-tag { font-size: 38px; font-weight: bold; margin: 10px 0; color: #ffd700; }
        .btn { display: block; width: 100%; padding: 15px; margin: 8px 0; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 14px; box-sizing: border-box; }
        .btn-gold { background: #ffd700; color: black; }
        .btn-dark { background: #333; color: white; border: 1px solid #444; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

    <div id="premium-card">
        <p style="color: #888; font-size: 12px; margin-bottom: 5px;">ВАШ ПЕРСОНАЛЬНИЙ РОЗРАХУНОК</p>
        <h2 id="car-title" style="margin: 0;">Audi A6</h2>
        <div class="price-tag" id="car-price">0 €</div>
        <p style="color: #00ff00; font-size: 13px;">✅ Включено: розмитнення, логістика, послуги</p>
        
        <a href="https://t.me/byklya_top" class="btn btn-gold">🔥 ХОЧУ ЦЕ АВТО</a>
        <div class="grid">
            <a href="https://t.me/byklya_top" class="btn btn-dark">🔨 СТАВКА</a>
            <a href="https://t.me/byklya_top" class="btn btn-dark">📋 ЗВІТ</a>
        </div>
        <a href="https://t.me/byklya_top" class="btn btn-dark" style="border-color: #ffd700; color: #ffd700;">🔍 ЗАМОВИТИ ОГЛЯД</a>
        <button onclick="location.reload()" style="background:none; border:none; color:#555; cursor:pointer; margin-top:10px;">⬅️ Повернутись до калькулятора</button>
    </div>

    <div id="standard-calc" class="calc-container">
        <h2 style="text-align: center; color: #ffd700;">Smart Calc 2026</h2>
        <label>Ціна авто (€)</label>
        <input type="number" id="input-price" placeholder="Наприклад: 10000">
        
        <label>Рік випуску</label>
        <select id="input-year">
            <option value="1">2023-2026 (Нові)</option>
            <option value="5">2019-2022</option>
            <option value="10" selected>2014-2018</option>
            <option value="15">До 2013</option>
        </select>

        <label>Тип двигуна</label>
        <select id="input-fuel">
            <option value="50">Бензин</option>
            <option value="75">Дизель</option>
            <option value="0">Електро</option>
        </select>

        <button class="calc-btn" onclick="calculate()">РОЗРАХУВАТИ</button>
        
        <div id="result-box" style="margin-top: 20px; display: none; text-align: center;">
            <hr style="border: 0.5px solid #333;">
            <p>Під ключ: <b id="res-total" style="font-size: 20px; color: #ffd700;">0</b></p>
            <a href="https://t.me/byklya_top" style="color: #ffd700; text-decoration: none; font-size: 14px;">Консультація менеджера ➔</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Перевірка: чи прийшли ми з бота
        if (params.get('make')) {
            document.getElementById('standard-calc').style.display = 'none';
            document.getElementById('premium-card').style.display = 'block';
            
            document.getElementById('car-title').innerText = params.get('make') + " " + (params.get('year') || "");
            document.getElementById('car-price').innerText = params.get('total') + " €/$";
        }

        // Функція калькулятора
        function calculate() {
            const price = parseFloat(document.getElementById('input-price').value);
            const age = parseFloat(document.getElementById('input-year').value);
            const fuelBase = parseFloat(document.getElementById('input-fuel').value);
            
            if (!price) return alert("Введіть ціну");

            let tax = 0;
            if (fuelBase > 0) {
                const duty = price * 0.10;
                const accise = fuelBase * 2.0 * age; // база 2.0л
                const vat = (price + duty + accise) * 0.20;
                tax = duty + accise + vat;
            } else {
                tax = 50; // для електро
            }

            const total = price + tax + 3200; // 3200 - доставка/послуги
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('res-total').innerText = Math.round(total) + " €/$";
        }
    </script>
</body>
</html>
