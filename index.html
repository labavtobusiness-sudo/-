<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Calc Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1e; color: white; padding: 20px; }
        .card { background: #2c2c2e; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; }
        button { width: 100%; background: #007aff; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; }
        .res { font-size: 20px; text-align: center; color: #30d158; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Smart Калькулятор 2026</h3>
        <label>Ціна авто (€)</label>
        <input type="number" id="price" value="5000">
        
        <label>Рік випуску</label>
        <select id="year">
            <option value="2025">2025</option>
            <option value="2022">2022</option>
            <option value="2018">2018</option>
        </select>

        <label>Двигун (літри)</label>
        <input type="number" id="engine" step="0.1" value="2.0">

        <button onclick="calculate()">Розрахувати</button>
        <div id="result" class="res"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function calculate() {
            let price = parseFloat(document.getElementById('price').value);
            let year = parseInt(document.getElementById('year').value);
            let engine = parseFloat(document.getElementById('engine').value);
            
            let age = 2026 - year;
            let duty = price * 0.10;
            let accise = 50 * engine * age;
            let vat = (price + duty + accise) * 0.20;
            let total = price + duty + accise + vat + 3200;

            document.getElementById('result').innerText = "Разом: ~" + Math.round(total) + "€";
        }
    </script>
</body>
</html>
