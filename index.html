<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LabAvtoBusiness Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1c; --blue: #34a8eb; --text: #ffffff; --sec: #9ea0a3; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { background: var(--card); border-radius: 28px; border: 1px solid #2c2c2e; overflow: hidden; max-width: 400px; margin: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .car-img { width: 100%; height: 220px; object-fit: cover; background: #252527; display: none; }
        .p-20 { padding: 20px; }
        .title { font-size: 22px; font-weight: 800; margin-bottom: 5px; text-align: center; }
        .calc-box { background: rgba(52, 168, 235, 0.08); padding: 18px; border-radius: 22px; border: 1px solid rgba(52, 168, 235, 0.2); margin: 15px 0; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--sec); }
        .total { font-size: 28px; font-weight: 900; color: var(--blue); text-align: center; border-top: 1px solid #333; padding-top: 15px; margin-top: 10px; }
        .btn { width: 100%; padding: 18px; background: var(--blue); border: none; border-radius: 18px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .input-group { margin-bottom: 15px; }
        label { font-size: 11px; color: var(--sec); margin-left: 5px; }
        input, select { width: 100%; padding: 14px; margin-top: 5px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 15px; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <img id="car-img" src="" class="car-img">
        <div class="p-20">
            <div id="view-title" class="title">SMART КАЛЬКУЛЯТОР 2026</div>
            <p id="sub-title" style="text-align:center; font-size:12px; color:var(--sec); margin-top:0;">@RozmytnyAvto</p>
            
            <div id="calc-inputs">
                <div class="input-group">
                    <label>Ціна автомобіля (€/$):</label>
                    <input type="number" id="in-price" placeholder="8500" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>Напрямок доставки:</label>
                    <select id="in-reg" onchange="calculate()">
                        <option value="1200">Європа (Польща/Литва)</option>
                        <option value="1500">Європа (Німеччина/Естонія)</option>
                        <option value="3400">США (Аукціон Copart/IAAI)</option>
                    </select>
                </div>
            </div>

            <div class="calc-box">
                <div class="row"><span>Вартість авто:</span><span id="res-price">$0</span></div>
                <div class="row"><span>Доставка та збори:</span><span id="res-deliv">$0</span></div>
                <div class="row"><span>Митні платежі:</span><span id="res-tax">$0</span></div>
                <div class="total" id="res-total">РАЗОМ: $0</div>
            </div>

            <button class="btn" id="main-action" onclick="order()">ЗАМОВИТИ КОНСУЛЬТАЦІЮ</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const carTitle = params.get('title');

        if (carTitle) {
            document.getElementById('view-title').innerText = carTitle;
            document.getElementById('car-img').src = params.get('img');
            document.getElementById('car-img').style.display = 'block';
            document.getElementById('calc-inputs').style.display = 'none';
            document.getElementById('main-action').innerText = "ЗВ'ЯЗАТИСЬ З МЕНЕДЖЕРОМ";
            updateValues(12500, 3400); 
        }

        function calculate() {
            let p = parseInt(document.getElementById('in-price').value) || 0;
            let d = parseInt(document.getElementById('in-reg').value);
            updateValues(p, d);
        }

        function updateValues(price, delivery) {
            let tax = price * 0.3; // Орієнтовне розмитнення
            let total = price + delivery + tax + 500;

            document.getElementById('res-price').innerText = "$" + price.toLocaleString();
            document.getElementById('res-deliv').innerText = "$" + delivery.toLocaleString();
            document.getElementById('res-tax').innerText = "$" + Math.round(tax).toLocaleString();
            document.getElementById('res-total').innerText = "ПІД КЛЮЧ: $" + Math.round(total).toLocaleString();
        }

        function order() {
            tg.HapticFeedback.notificationOccurred('success');
            tg.openTelegramLink("https://t.me/byklya_top");
        }
    </script>
</body>
</html>
