<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoImport Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .container { background: #1c1c1e; padding: 20px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #30d158; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #8e8e93; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 12px; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #30d158; color: #000; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 17px; margin-top: 15px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .result { margin-top: 25px; padding: 15px; background: #2c2c2e; border-radius: 15px; display: none; text-align: center; }
        .total-price { font-size: 28px; font-weight: 800; color: #30d158; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Calc 2026</h1>
        
        <div class="input-group">
            <label>Марка та модель</label>
            <input type="text" id="car_name" placeholder="Введіть авто">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>Рік</label>
                <input type="number" id="year" value="2021">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Об'єм (л)</label>
                <input type="number" id="engine" step="0.1" value="2.0">
            </div>
        </div>

        <div class="input-group">
            <label>Ціна в ЄС (€)</label>
            <input type="number" id="price" placeholder="10000">
        </div>

        <button onclick="calculate()">Порахувати "Під Ключ"</button>

        <div id="result" class="result">
            <span style="color: #8e8e93;">Вартість з розмитненням та послугами:</span>
            <div class="total-price" id="final-sum">0 €</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        // Підтягуємо дані з URL, якщо вони прийшли від бота
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.get('make')) document.getElementById('car_name').value = params.get('make');
            if(params.get('year')) document.getElementById('year').value = params.get('year');
            if(params.get('price')) document.getElementById('price').value = params.get('price');
        };

        function calculate() {
            let p = parseFloat(document.getElementById('price').value) || 0;
            let y = parseInt(document.getElementById('year').value) || 2021;
            let e = parseFloat(document.getElementById('engine').value) || 2.0;

            let age = 2026 - y;
            if(age < 1) age = 1;
            
            let duty = p * 0.10;
            let excise = 50 * e * age;
            let vat = (p + duty + excise) * 0.20;
            let service = 3200 * 0.92; // Комісія $3200 переведена в €

            let total = p + duty + excise + vat + service;

            document.getElementById('result').style.display = 'block';
            document.getElementById('final-sum').innerText = Math.round(total).toLocaleString() + ' €';
            
            // Вібрація при розрахунку
            tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
