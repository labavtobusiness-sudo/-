    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1c;
            --accent-blue: #34a8eb;
            --text-main: #ffffff;
            --text-secondary: #9ea0a3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 15px; width: 100%; }
        .car-photo-container {
            width: 100%; height: 120px; background: #252527;
            border-radius: 20px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #333;
        }
        .car-photo-container img { max-width: 80%; max-height: 80%; object-fit: contain; }

        .container {
            width: 100%; max-width: 400px; background: var(--card-bg);
            padding: 20px; border-radius: 24px; box-sizing: border-box; border: 1px solid #2c2c2e;
        }

        .region-selector { display: flex; background: #2c2c2e; padding: 4px; border-radius: 14px; margin-bottom: 20px; }
        .region-btn { flex: 1; padding: 10px; border-radius: 11px; border: none; background: none; color: var(--text-secondary); font-weight: 600; cursor: pointer; }
        .region-btn.active { background: var(--accent-blue); color: white; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 14px; color: #fff; font-size: 16px; box-sizing: border-box; }

        .calc-btn { width: 100%; border: none; padding: 18px; border-radius: 16px; font-weight: bold; font-size: 17px; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: var(--accent-blue); color: #fff; }
        .btn-green { background: #28a745; color: #fff; margin-top: 10px; }

        .result { margin-top: 20px; padding: 15px; background: rgba(52, 168, 235, 0.1); border-radius: 16px; display: none; text-align: center; border: 1px solid var(--accent-blue); }
        .result-val { font-size: 26px; font-weight: 800; color: var(--accent-blue); }
    </style>
</head>
