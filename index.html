<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор @RozmytnyAvto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f; --card-bg: #1a1a1c; --accent-blue: #34a8eb;
            --text-main: #ffffff; --text-secondary: #9ea0a3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
        }
        .container {
            width: 100%; max-width: 400px; background: var(--card-bg);
            padding: 20px; border-radius: 24px; box-sizing: border-box; border: 1px solid #2c2c2e;
        }
        .region-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
        }
        .region-btn {
            padding: 10px; border-radius: 12px; border: 1px solid #3a3a3c;
            background: #2c2c2e; color: var(--text-secondary); font-weight: 600; cursor: pointer;
        }
        .region-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 14px; color: #fff; outline: none; box-sizing: border-box; }
        
        .calc-btn { width: 100%; border: none; padding: 18px; border-radius: 16px; font-weight: bold; font-size: 17px; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: var(--accent-blue); color: #fff; }
        .btn-green { background: #28a745; color: #fff; margin-top: 12px; }
        .result { margin-top: 20px; padding: 15px; background: rgba(52, 168, 235, 0.1); border-radius: 16px; display: none; text-align: center; border: 1px solid var(--accent-blue); }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center; margin-top: 0;">Оберіть країну 🌍</h2>
        <div class="region-grid">
            <button class="region-btn active" id="btn-EU" onclick="setRegion('EU', 'Німеччина 🇩🇪')">Німеччина</button>
            <button class="region-btn" id="btn-LT" onclick="setRegion('LT', 'Литва 🇱🇹')">Литва</button>
            <button class="region-btn" id="btn-PL" onclick="setRegion('PL', 'Польща 🇵🇱')">Польща</button>
            <button class="region-btn" id="btn-USA" onclick="setRegion('USA', 'США 🇺🇸')">США</button>
        </div>

        <div class="input-group">
            <label>Марка авто</label>
            <select id="make">
                <option value="Audi">Audi</option><option value="BMW">BMW</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option><option value="Volkswagen">Volkswagen</option>
                <option value="Toyota">Toyota</option><option value="Skoda">Skoda</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;"><label>Рік</label><select id="year"></select></div>
            <div class="input-group" style="flex: 1;"><label>Ціна</label><input type="number" id="price" placeholder="1000"></div>
        </div>

        <button class="calc-btn btn-blue" onclick="calculate()">💰 Порахувати</button>
        <button class="calc-btn btn-green" onclick="subscribe()">🔔 Підписатись на оновлення</button>

        <div id="result" class="result">
            <div style="color: var(--text-secondary); font-size: 14px;" id="res-label">Розмитнення:</div>
            <div style="font-size: 24px; font-weight: 800; color: var(--accent-blue);" id="finalSum">0 €</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let currentRegion = 'EU';
        
        function setRegion(r, label) {
            currentRegion = r;
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + r).classList.add('active');
        }

        const yearSelect = document.getElementById('year');
        for (let y = 2026; y >= 2000; y--) {
            let opt = document.createElement('option'); opt.value = y; opt.innerHTML = y;
            yearSelect.appendChild(opt);
        }

        function calculate() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            let total = price * 1.3 + 1200; // Спрощена формула
            document.getElementById('result').style.display = 'block';
            document.getElementById('finalSum').innerText = Math.round(total).toLocaleString() + ' €';
        }

        function subscribe() {
            const make = document.getElementById('make').value;
            const year = document.getElementById('year').value;
            tg.sendData(`sub|${make}|${year}|${currentRegion}`);
            tg.close();
        }
    </script>
</body>
</html>
