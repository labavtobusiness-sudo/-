<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LabAvtoBusiness Calc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1c; --blue: #34a8eb; --text: #ffffff; --sec: #9ea0a3; --input-bg: #2c2c2e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { background: var(--card); border-radius: 28px; border: 1px solid #2c2c2e; overflow: hidden; max-width: 400px; margin: auto; padding-bottom: 20px; }
        .p-20 { padding: 20px; }
        .title { font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 20px; text-transform: uppercase; color: var(--blue); }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--sec); margin-bottom: 5px; margin-left: 5px; text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid #3a3a3c; 
            border-radius: 12px; color: #fff; font-size: 16px; box-sizing: border-box; outline: none;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .calc-box { background: rgba(52, 168, 235, 0.05); padding: 18px; border-radius: 20px; border: 1px solid rgba(52, 168, 235, 0.15); margin-top: 10px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: var(--sec); }
        .row b { color: var(--text); }
        
        .total { font-size: 22px; font-weight: 900; color: var(--blue); text-align: center; border-top: 1px solid #333; padding-top: 15px; margin-top: 10px; }
        .btn { width: 100%; padding: 16px; background: var(--blue); border: none; border-radius: 15px; color: white; font-weight: bold; margin-top: 20px; font-size: 16px; cursor: pointer; }
        
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
        .checkbox-row input { width: auto; }
    </style>
</head>
<body>

    <div class="container">
        <div class="p-20">
            <div class="title">Калькулятор LabAvtoBusiness</div>
            
            <div class="input-group">
                <label>Країна:</label>
                <select id="country" onchange="run()">
                    <option value="USA">США 🇺🇸</option>
                    <option value="Lithuania" selected>Литва 🇱🇹</option>
                    <option value="Germany">Німеччина 🇩🇪</option>
                    <option value="Latvia">Латвія 🇱🇻</option>
                    <option value="Estonia">Естонія 🇪🇪</option>
                    <option value="Denmark">Данія 🇩🇰</option>
                    <option value="Belgium">Бельгія 🇧🇪</option>
                    <option value="Norway">Норвегія 🇳🇴</option>
                    <option value="Italy">Італія 🇮🇹</option>
                    <option value="France">Франція 🇫🇷</option>
                </select>
            </div>

            <div class="grid">
                <div class="input-group">
                    <label id="label-price">Ціна (EUR):</label>
                    <input type="number" id="price" value="5000" oninput="run()">
                </div>
                <div class="input-group">
                    <label>Рік випуску:</label>
                    <select id="year" onchange="run()">
                        </select>
                </div>
            </div>

            <div class="grid">
                <div class="input-group">
                    <label>Тип палива:</label>
                    <select id="fuel" onchange="run()">
                        <option value="petrol">Бензин</option>
                        <option value="diesel">Дизель</option>
                        <option value="electric">Електро</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Двигун (л):</label>
                    <input type="number" id="engine" value="2.0" step="0.1" oninput="run()">
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="isMil" onchange="run()">
                <label for="isMil" style="display:inline; text-transform:none; font-size:14px; color:var(--text)">Пільга для військових</label>
            </div>

            <div class="calc-box">
                <div class="row"><span>Авто:</span><b id="res-price">0</b></div>
                <div class="row"><span>Розмитнення:</span><b id="res-tax">0</b></div>
                <div class="row"><span>Послуги + Доставка:</span><b id="res-service">0</b></div>
                <div class="total" id="res-total">РАЗОМ: 0</div>
            </div>

            <button class="btn
